services:
  db:
    image: postgres:15-alpine
    container_name: cms_crm_db_prod
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - cms_crm_network_prod
    restart: always

  redis:
    image: redis:7-alpine
    container_name: cms_crm_redis_prod
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - cms_crm_network_prod
    restart: always

  backend:
    build:
      context: ./backend-django
      dockerfile: Dockerfile.prod
    container_name: cms_crm_backend_prod
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2
    volumes:
      - backend_static_prod:/app/staticfiles
      - backend_media_prod:/app/media
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DEBUG=False
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cms_crm_network_prod
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: cms_crm_frontend_prod
    command: npm start
    volumes:
      - backend_static_prod:/app/public:ro
    environment:
      - NEXT_PUBLIC_API_URL=${API_URL}
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - cms_crm_network_prod
    restart: always

  nginx:
    image: nginx:alpine
    container_name: cms_crm_nginx_prod
    volumes:
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - backend_static_prod:/static:ro
      - backend_media_prod:/media:ro
      - ./letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - cms_crm_network_prod
    restart: always

volumes:
  postgres_data_prod:
  redis_data_prod:
  backend_static_prod:
  backend_media_prod:

networks:
  cms_crm_network_prod:
    driver: bridge

