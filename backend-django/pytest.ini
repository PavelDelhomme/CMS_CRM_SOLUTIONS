[pytest]
DJANGO_SETTINGS_MODULE = config.core.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
testpaths = apps tests
norecursedirs = media .git __pycache__ .pytest_cache
addopts = 
    --reuse-db
    --nomigrations
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --ignore=media

