version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cms_crm_db
    environment:
      POSTGRES_DB: ${DB_NAME:-cms_crm_solutions}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "9496:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cms_crm_network

  redis:
    image: redis:7-alpine
    container_name: cms_crm_redis
    ports:
      - "9497:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cms_crm_network

  backend:
    build:
      context: ./backend-django
      dockerfile: Dockerfile
    container_name: cms_crm_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend-django:/app
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    ports:
      - "9495:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-cms_crm_solutions}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cms_crm_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cms_crm_frontend
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "9494:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:9495/api
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - cms_crm_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: cms_crm_nginx
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - backend_static:/static:ro
      - backend_media:/media:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - cms_crm_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_static:
  backend_media:

networks:
  cms_crm_network:
    driver: bridge

