services:
  db:
    image: postgres:15-alpine
    container_name: cms_crm_db
    environment:
      POSTGRES_DB: ${DB_NAME:-cmscrm}
      POSTGRES_USER: ${DB_USER:-cmscrm_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cmscrm_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "9191:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmscrm_user -d cmscrm"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cms_crm_network

  redis:
    image: redis:7-alpine
    container_name: cms_crm_redis
    ports:
      - "9192:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cms_crm_network

  backend:
    build:
      context: ./backend-django
      dockerfile: Dockerfile
    container_name: cms_crm_backend
    command: python manage.py runserver 0.0.0.0:8000
    # Limite optionnelle en dev pour éviter de saturer la machine (prod: voir docker-compose.prod.yml)
    deploy:
      resources:
        limits:
          memory: 1024M
    volumes:
      - ./backend-django:/app
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    ports:
      - "9193:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-cmscrm}
      - DB_USER=${DB_USER:-cmscrm_user}
      - DB_PASSWORD=${DB_PASSWORD:-cmscrm_password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - cms_crm_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cms_crm_frontend
    command: npm run dev
    # Limite optionnelle en dev (next dev est gourmand en RAM; prod: build + start dans docker-compose.prod.yml)
    deploy:
      resources:
        limits:
          memory: 1536M
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "9194:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:9193/api
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - cms_crm_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: cms_crm_nginx
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - backend_static:/static:ro
      - backend_media:/media:ro
    ports:
      - "9195:80"
      - "9196:443"
    depends_on:
      - backend
      - frontend
    networks:
      - cms_crm_network
    restart: unless-stopped

  # Service pour les tests E2E Playwright
  playwright:
    build:
      context: ./frontend
      dockerfile: Dockerfile.test
    container_name: cms_crm_playwright
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./frontend/playwright-report:/app/playwright-report
      - ./frontend/test-results:/app/test-results
    environment:
      - CI=true
      - BASE_URL=http://frontend:3000
      - API_URL=http://backend:8000/api
      - DOCKER=true
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - cms_crm_network
    profiles:
      - test
    # Les services sont déjà healthy grâce aux healthchecks, on peut lancer directement
    command: >
      sh -c "
        echo '✅ Services prêts (healthchecks passés), lancement des tests...' &&
        npx playwright test --reporter=html
      "

volumes:
  postgres_data:
  redis_data:
  backend_static:
  backend_media:

networks:
  cms_crm_network:
    driver: bridge

